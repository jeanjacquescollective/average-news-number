<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nieuwsgetal Geschiedenis</title>
  <meta name="description" content="Records en geschiedenis van het dagelijks gemiddeld nieuwsgetal.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>#</text></svg>">
  <script>try { var m = localStorage.getItem("theme"); if (m === "light" || m === "dark") document.documentElement.dataset.theme = m; } catch (e) {}</script>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="history">
  <header class="masthead" id="masthead"></header>

  <main>
    <h1 class="page-title" data-i18n="historyTitle">Geschiedenis</h1>
    <p class="lede" id="lede" data-i18n="loading">Laden…</p>
    <section id="headlines" hidden>
      <h2 class="section-title" data-i18n="headlinesHeading">Koppen op de voorpagina</h2>
      <div class="records"></div>
      <div class="table-wrap"><table></table></div>
    </section>
  </main>

  <script src="common.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const shortDay = { weekday: "short", day: "numeric", month: "short", year: "numeric" };

    function pick(days, kind, field, better) {
      return days.reduce((best, d) => (best === null || better(d[kind][field], best[kind][field]) ? d : best), null);
    }

    function dayRecord(title, day, kind, field) {
      return el("article", { class: "record" },
        el("h3", {}, t(title)),
        recordValue(formatNumber(day[kind][field])),
        el("p", { class: "context" }, el("a", { href: `./?date=${day.date}` }, formatDay(day.date, shortDay)),
          ` · ${t("numbers", day[kind].numbers)}`),
      );
    }

    function numberRecord(title, day, ref, fallbackTitle) {
      return el("article", { class: "record" },
        el("h3", {}, t(title)),
        recordValue(formatNumber(ref.v)),
        el("p", { class: "context" }, `“${ref.t}” ${t("inHeadline")} `,
          el("a", { href: ref.url, target: "_blank", rel: "noopener" }, ref.title || t(fallbackTitle)),
          `, ${formatDay(day.date, shortDay)}`),
      );
    }

    // Records and a day-by-day table for one kind of stats ("headlines").
    function renderSection(section, allDays, kind, countColumn, fallbackTitle) {
      const today = todayInBrussels();
      const days = allDays.filter((d) => d[kind].numbers > 0);
      section.hidden = days.length === 0;
      if (!days.length) return;

      const complete = days.filter((d) => d.date < today);
      const higher = (a, b) => a > b;
      const lower = (a, b) => a < b;
      const records = complete.length
        ? [
            dayRecord("highestMean", pick(complete, kind, "mean", higher), kind, "mean"),
            dayRecord("lowestMean", pick(complete, kind, "mean", lower), kind, "mean"),
            dayRecord("highestMedian", pick(complete, kind, "median", higher), kind, "median"),
            dayRecord("lowestMedian", pick(complete, kind, "median", lower), kind, "median"),
          ]
        : [];
      const biggest = days.reduce((best, d) => (!best || d[kind].max.v > best[kind].max.v ? d : best), null);
      const smallest = days.reduce((best, d) => (!best || d[kind].min.v < best[kind].min.v ? d : best), null);
      records.push(
        numberRecord("biggest", biggest, biggest[kind].max, fallbackTitle),
        numberRecord("smallest", smallest, smallest[kind].min, fallbackTitle),
      );
      if (!complete.length) records.push(el("p", { class: "record context" }, t("recordsLater")));
      section.querySelector(".records").replaceChildren(...records);

      const columns = ["colDay", countColumn, "colNumbers", "colMean", "colMedian", "colSmallest", "colBiggest"];
      const head = el("thead", {}, el("tr", {}, ...columns.map((c) => el("th", { scope: "col" }, t(c)))));
      const rows = [...days].reverse().map((d) => {
        const s = d[kind];
        const partial = d.date >= today;
        return el("tr", { class: partial ? "partial" : null },
          el("td", {}, el("a", { href: `./?date=${d.date}` }, formatDay(d.date, shortDay)), partial ? t("soFar") : ""),
          el("td", { class: "tabular" }, formatNumber(s.count)),
          el("td", { class: "tabular" }, formatNumber(s.numbers)),
          el("td", { class: "tabular" }, formatNumber(s.mean)),
          el("td", { class: "tabular" }, formatNumber(s.median)),
          el("td", { class: "tabular", title: s.min.t }, formatNumber(s.min.v)),
          el("td", { class: "tabular", title: s.max.t }, formatNumber(s.max.v)),
        );
      });
      section.querySelector("table").replaceChildren(head, el("tbody", {}, ...rows));
    }

    async function render() {
      let summary;
      try {
        summary = await loadSummary();
      } catch {
        $("lede").textContent = t("noData");
        return;
      }

      const total = (kind, field) => summary.days.reduce((sum, d) => sum + d[kind][field], 0);
      const since = formatDay(summary.tracking_start, shortDay);
      $("lede").textContent = total("headlines", "numbers")
        ? t("historyLede", t("numbers", total("headlines", "numbers")), total("headlines", "count"), since)
        : t("noData");

      renderSection($("headlines"), summary.days, "headlines", "colHeadlines", "aHeadline");
    }

    setupPage(render);
  </script>
</body>
</html>
