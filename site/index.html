<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemiddeld Nieuwsgetal</title>
  <meta name="description" content="Dagelijks gemiddeld nieuwsgetal.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>#</text></svg>">
  <script>try { var m = localStorage.getItem("theme"); if (m === "light" || m === "dark") document.documentElement.dataset.theme = m; } catch (e) {}</script>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="index">
  <header class="masthead" id="masthead"></header>

  <main>
    <section class="hero" aria-live="polite">
      <p class="kicker" id="label" data-i18n="loading">Laden…</p>
      <div class="number-row">
        <p class="big-number" id="mean"></p>
        <button class="info-button" id="info" type="button" data-i18n-label="infoTitle" hidden>i</button>
      </div>
      <p class="median" id="median"></p>
      <p class="ornament" aria-hidden="true">✦ ✦ ✦</p>
      <nav class="day-nav" id="day-nav" data-i18n-label="otherDays" hidden>
        <a id="prev" href="#" data-i18n="prevDay">‹ vorige dag</a>
        <a id="next" href="#" data-i18n="nextDay">volgende dag ›</a>
      </nav>
      <p class="today-note" id="today-note"></p>
    </section>
  </main>

  <footer class="site">
    <span id="updated"></span>
  </footer>

  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-head">
      <h2 id="dialog-title" data-i18n="infoTitle">Waar komt dit getal vandaan?</h2>
      <button class="close-button" id="close" type="button" data-i18n-label="close">×</button>
    </div>
    <div class="dialog-body" id="dialog-body"></div>
  </dialog>

  <script src="common.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    function setNav(anchor, day) {
      anchor.href = day ? `?date=${day.date}` : "#";
      anchor.setAttribute("aria-disabled", day ? "false" : "true");
      anchor.tabIndex = day ? 0 : -1;
    }

    // One <li> per headline or article: time, link, and the numbers found in it.
    function itemList(items, timeField) {
      const list = el("ol", { class: "articles" });
      for (const item of items) {
        const time = item[timeField] || item.first_seen;
        list.append(el("li", {},
          el("div", { class: "meta" }, `${time ? formatTime(time) : ""} · ${t("numbers", item.numbers.length)}`),
          el("a", { class: "title", href: item.url, target: "_blank", rel: "noopener" }, item.title || item.url),
          numberList(item.numbers),
        ));
      }
      return list;
    }

    async function openInfo(day, isPartial) {
      const h = day.headlines;
      const a = day.articles;
      const body = $("dialog-body");
      const status = el("p", {}, t("loadingDay"));
      body.replaceChildren(
        el("p", {},
          t("sourceBefore"),
          el("a", { href: "https://www.vrt.be/vrtnws/nl/", target: "_blank", rel: "noopener" }, "VRT NWS"),
          t("sourceAfter", isPartial, formatDay(day.date)),
          el("strong", {}, t("headlinesTotals", t("numbers", h.numbers), h.count)),
          t("statsSentence", formatNumber(h.mean), formatNumber(h.median)),
        ),
        status,
      );
      $("dialog").showModal();
      try {
        const data = await loadDay(day.date);
        const articles = a.numbers
          ? [el("p", {}, t("articlesExplained", a.count, t("numbers", a.numbers), formatNumber(a.mean), formatNumber(a.median))),
             itemList(data.articles || [], "published")]
          : [el("p", {}, t("articlesNone"))];
        status.replaceWith(
          el("h3", {}, t("headlinesHeading")),
          itemList(data.headlines || [], "first_seen"),
          el("h3", {}, t("articlesHeading")),
          ...articles,
        );
      } catch {
        status.textContent = t("loadError");
      }
    }

    async function render() {
      if ($("dialog").open) $("dialog").close();
      let summary;
      try {
        summary = await loadSummary();
      } catch {
        $("label").textContent = t("noData");
        return;
      }

      const today = todayInBrussels();
      const days = summary.days.filter((d) => d.headlines.numbers > 0);
      const requested = new URLSearchParams(location.search).get("date");
      const complete = days.filter((d) => d.date < today);
      const day = days.find((d) => d.date === requested) || complete.at(-1) || days.at(-1);

      if (!day) {
        $("label").textContent = t("noData");
        return;
      }

      const isPartial = day.date >= today;
      const isYesterday = day === complete.at(-1);
      $("label").textContent = isPartial
        ? t("labelToday")
        : t(isYesterday ? "labelYesterday" : "labelDay", formatDay(day.date));

      const meanText = formatNumber(day.headlines.mean);
      $("mean").textContent = meanText;
      $("mean").style.setProperty("--big-size", `min(12rem, ${Math.round(140 / Math.max(meanText.length, 5))}vw)`);
      $("median").replaceChildren(`${t("median")} `, el("strong", { class: "tabular" }, formatNumber(day.headlines.median)));
      document.title = `${meanText} · ${t("brand")}`;

      const index = days.indexOf(day);
      setNav($("prev"), days[index - 1]);
      setNav($("next"), days[index + 1]);
      $("day-nav").hidden = days.length < 2;

      const todayStats = days.find((d) => d.date === today);
      $("today-note").replaceChildren(...(!isPartial && todayStats
        ? [t("todaySoFar"), el("a", { href: `?date=${today}` }, formatNumber(todayStats.headlines.mean))]
        : []));

      $("info").hidden = false;
      $("info").onclick = () => openInfo(day, isPartial);
      if (summary.updated_at) {
        const when = `${formatDay(summary.updated_at.slice(0, 10), { day: "numeric", month: "short" })}, ${formatTime(summary.updated_at)}`;
        $("updated").textContent = t("lastUpdate", when);
      }
    }

    $("close").onclick = () => $("dialog").close();
    $("dialog").addEventListener("click", (event) => {
      if (event.target === $("dialog")) $("dialog").close();
    });
    setupPage(render);
  </script>
</body>
</html>
